<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>אפליקציית ה-Java שלי</title>
    <!-- טעינת ספריית CheerpJ הרשמית מהשרת שלהם -->
    <script src="https://leaningtech.com"></script>
</head>
<body>
    <h2>האפליקציה שלי רצה בדפדפן!</h2>
    
    <script>
        // אתחול סביבת הריצה של Java בדפדפן
        cheerpjInit().then(function() {
            // הרצת קובץ ה-JAR שלך (החלף את myApp.jar בשם הקובץ שלך)
            // הפרמטר השני הוא מערך של ארגומנטים (אם יש צורך)
            cheerpjRunJar("/app/myApp.jar");
        });
    </script>
</body>
</html>
